name: Build and deploy NestJS app to Azure Web App - proyecto-final-api-ivan

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ← fix deprecation warning

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4        # ← v4 actualizado
        with:
          node-version: '22.x'

      # Instala TODAS las deps (incluyendo devDeps para tener nest CLI)
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # Compila TypeScript → dist/
      - name: Build NestJS
        working-directory: backend
        run: npm run build

      # Instala solo deps de producción para el deploy
      - name: Install production dependencies only
        working-directory: backend
        run: npm ci --omit=dev

      # Sube: dist/ + node_modules (prod) + package.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            backend/dist
            backend/node_modules
            backend/package.json
            backend/package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_06CED959DA4B46459845D80C3CE321FF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_697D06F7F082441F8D65BF2C7EBD4799 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9D73884985C64037BB1E9CDC8DAF7BFB }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'proyecto-final-api-ivan'
          slot-name: 'Production'
          package: .
