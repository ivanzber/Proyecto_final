name: Build and Deploy NestJS Backend to Azure

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/main_campus-udec-backend.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Node.js 18
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 3. Instalar TODAS las dependencias (dev incluidas para el build)
      - name: Install all dependencies
        run: npm ci

      # 4. Compilar TypeScript → dist/
      - name: Build NestJS application
        run: npm run build

      # 5. Borrar node_modules y reinstalar SOLO producción
      - name: Install production dependencies only
        run: |
          rm -rf node_modules
          npm ci --omit=dev

      # 6. Crear el artefacto de despliegue:
      #    dist/ + node_modules/ + package.json
      - name: Zip artifact for deployment
        run: |
          zip -r ../release.zip \
            dist/ \
            node_modules/ \
            package.json \
            package-lock.json

      # 7. Subir el artefacto
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: nestjs-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'proyecto-final-api-ivan'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
